version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowzint_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://flowzint:flowzint123@db:5432/flowzint_bot
      - DEBUG=True
      - PORT=8000
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app        # Hot reload in dev
    restart: unless-stopped
    networks:
      - flowzint_net

  # ── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: flowzint_db
    environment:
      POSTGRES_USER: flowzint
      POSTGRES_PASSWORD: flowzint123
      POSTGRES_DB: flowzint_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowzint -d flowzint_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowzint_net

# ── Volumes & Networks ───────────────────────────────────────────────────────
volumes:
  postgres_data:

networks:
  flowzint_net:
    driver: bridge
